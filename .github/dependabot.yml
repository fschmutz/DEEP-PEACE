version: 2
updates:
  # Actions rot quietly: a pinned tag keeps working until the runner image drops
  # the Node version it bundles, and then every workflow fails at once.
  #
  # Workflows here pin actions to a full commit SHA with the version as a
  # trailing comment. Dependabot understands that shape: it bumps the SHA and
  # rewrites the comment, so pinning buys immutability without freezing.
  #
  # It only scans .github/workflows/. The disabled workflows under
  # .github/bundles/ are not updated — re-resolve their SHAs when you enable one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"
    labels: ["dependencies"]

  # pre-commit pins its hook repos by rev. Without this the secret scanner and
  # the workflow linter stay frozen at whatever version the repo was created on.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(pre-commit)"
    labels: ["dependencies"]

  # --- Optional: uncomment the ecosystem this repository actually uses. -------
  # Leaving a block enabled for an ecosystem with no manifest produces a
  # recurring Dependabot error on the repository, so enable deliberately.
  #
  # - package-ecosystem: npm
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   commit-message:
  #     prefix: "chore(npm)"
  #   labels: ["dependencies"]
  #   groups:
  #     dev-dependencies:
  #       dependency-type: development
  #
  # - package-ecosystem: pip
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   commit-message:
  #     prefix: "chore(pip)"
  #   labels: ["dependencies"]
  #
  # - package-ecosystem: docker
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   commit-message:
  #     prefix: "chore(docker)"
  #   labels: ["dependencies"]
